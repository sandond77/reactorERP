name: Vision curation (weekly)

# Runs the vision-subagent correction curation script against prod and,
# if there are any unreviewed corrections, opens (or updates) a GitHub
# issue with the markdown report as the body. If the report finds zero
# corrections in the window, the workflow exits quietly — no issue is
# opened, so early quiet weeks don't spam.
#
# One-time setup (already done, listed here for future reference):
#   1. Repo Settings → Secrets and variables → Actions → New secret
#      Name:  CURATION_DATABASE_URL
#      Value: same postgres connection string as Railway's
#             DATABASE_PUBLIC_URL variable
#      The value is masked in logs and never committed anywhere.
#   2. That's it. Cron fires Monday 8am PST; workflow_dispatch lets you
#      run it manually from the Actions tab any time.

on:
  schedule:
    # Monday 15:00 UTC = 8am PST / 7am PDT.  cron uses UTC.
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'Look back N days'
        required: false
        default: '7'
      source:
        description: 'Correction source'
        required: false
        default: 'card_extraction'

permissions:
  contents: read
  issues: write        # needed for gh issue create

concurrency:
  # A weekly run finishing before the next fires is a hard requirement.
  # If a hung run overlaps with the next schedule, cancel the older one
  # so we don't end up with two issues open for the same window.
  group: vision-curation
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm ci --no-audit --no-fund

      - name: Run curation
        id: curate
        env:
          DATABASE_URL: ${{ secrets.CURATION_DATABASE_URL }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          SOURCE: ${{ github.event.inputs.source || 'card_extraction' }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::CURATION_DATABASE_URL secret is not configured. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          # Capture stdout to a file so we can both display it in the log
          # AND use it as the issue body. Errors go to stderr so a script
          # failure surfaces in the Actions log even if stdout is empty.
          npx tsx server/src/scripts/curate-vision-corrections.ts \
            --days "$DAYS" --source "$SOURCE" \
            | tee curation-report.md

          # Extract the count from the machine-readable marker the script
          # emits on line 1: `<!--curation:count=N-->`.
          COUNT=$(grep -oE 'curation:count=[0-9]+' curation-report.md | head -1 | cut -d= -f2 || echo 0)
          echo "count=${COUNT:-0}" >> "$GITHUB_OUTPUT"
          echo "Curation found $COUNT unreviewed corrections."

      - name: Skip (no corrections)
        if: steps.curate.outputs.count == '0'
        run: echo "Nothing to review this week — not opening an issue."

      - name: Open review issue
        if: steps.curate.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.curate.outputs.count }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          SOURCE: ${{ github.event.inputs.source || 'card_extraction' }}
        run: |
          set -euo pipefail
          TITLE="Vision curation — $COUNT unreviewed correction(s) [$SOURCE, last ${DAYS}d]"
          BODY_FILE=curation-issue.md
          {
            echo "This report was auto-generated by \`.github/workflows/curate-vision-corrections.yml\`."
            echo ""
            echo "**What to do:** review the clusters below. For each pattern worth teaching the subagent, add a rule to \`server/src/services/ai/vision.rules.md\` or a few-shot to \`vision.examples.md\`. When you're done, close this issue and run the SQL at the bottom to mark those corrections reviewed so they don't reappear next week."
            echo ""
            echo "---"
            echo ""
            cat curation-report.md
          } > "$BODY_FILE"

          # Idempotent label — succeeds whether the label already exists or
          # is being created for the first time. Keeps the workflow
          # self-bootstrapping on a fresh repo.
          gh label create vision-curation \
            --description 'Auto-generated by weekly curation workflow' \
            --color 'A78BFA' \
            --force \
            --repo "${{ github.repository }}" || true

          gh issue create \
            --title "$TITLE" \
            --body-file "$BODY_FILE" \
            --label 'vision-curation' \
            --repo "${{ github.repository }}"
